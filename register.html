<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Savore Café</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/toast.css">
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <a class="brand" href="index.html"><span class="brand-mark">S</span>SAVORE CAFÉ</a>
      <a class="btn btn-light" style="background:var(--forest);color:white" href="login.html">Login</a>
    </div>
  </header>
  <main class="auth-shell">
    <div class="auth-card form-card">
      <div class="eyebrow">Join the table</div>
      <h1>Create account</h1>
      <p>Save your details for a smoother next order.</p>
      <p class="auth-note">Your account is ready right away — no email verification needed.</p>
      <div class="alert" data-auth-message role="status" aria-live="polite"></div>
      <form data-register-form>
        <div class="field">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" type="text" autocomplete="name" placeholder="Your full name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" required>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Repeat your password" required>
        </div>
        <button class="btn btn-green" style="width:100%" type="submit">Create account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
